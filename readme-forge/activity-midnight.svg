<style>svg{--bg1:#0d1117;--bg2:#161b2e;--border:#30363d;--title:#ff4d8d;--text:#e6edf3;--muted:#8b949e;--accent:#ff4d8d;--accent2:#7c5cff;--track:#21262d;--grid:#1f2633;}
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:var(--text)}
.title{font-size:17px;font-weight:700;fill:var(--title)}
.sub{font-size:12px;fill:var(--muted)}
.label{font-size:12px;fill:var(--muted);letter-spacing:.3px}
.value{font-size:15px;font-weight:700;fill:var(--text);font-variant-numeric:tabular-nums}
.big{font-weight:800;fill:var(--text);font-variant-numeric:tabular-nums}
.fade{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.line{stroke-dasharray:1;stroke-dashoffset:0;animation:line 2s cubic-bezier(.4,.1,.2,1) .2s both}
@keyframes line{from{stroke-dashoffset:1}}
.area{animation:fadeUp 1s ease-out 1s both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}</style>
